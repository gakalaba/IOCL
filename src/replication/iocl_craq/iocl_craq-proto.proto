syntax = "proto2";

import "request.proto";

package replication.iocl_craq.proto;

message RequestMessage {
    required replication.Request req = 1;
}

message ReplyMessage {
    required uint64 view = 1;
    required uint64 opnum = 2;
    required uint64 clientreqid = 3;
    required bytes reply = 4;
}

message UnloggedRequestMessage {
    required replication.UnloggedRequest req = 1;
}

message UnloggedReplyMessage {
    required bytes reply = 1;
    required uint64 clientreqid = 2;
}

message PrepareMessage {
    required uint64 view = 1;
    required uint64 opnum = 2;
    required uint64 batchstart = 3;
    repeated Request request = 4;
}

// Extended with vector_clock for IOCL-CRAQ
message CommitMessage {
    required uint64 view = 1;
    required uint64 opnum = 2;
    required string key = 3;
    repeated uint64 vector_clock = 4;
}

message RequestStateTransferMessage {
    required uint64 view = 1;
    required uint64 opnum = 2;
}

message StateTransferMessage {
    message LogEntry {
        required uint64 view = 1;
        required uint64 opnum = 2;
        required replication.Request request = 3;
        optional uint32 state = 4;
        optional bytes hash = 5;
    }
    required uint64 view = 1;
    required uint64 opnum = 2;
    repeated LogEntry entries = 3;
}

message VersionRequestMessage {
    required string key = 1;
    required uint64 clientid = 2;
    required uint64 clientreqid = 3;
    required uint32 replicaIdx = 4;
}

// Extended with vector_clock for IOCL-CRAQ
message VersionResponseMessage {
    required uint64 clientid = 1;
    required uint64 clientreqid = 2;
    required uint64 opnum = 3;
    repeated uint64 vector_clock = 4;
}

// CoordRequest: client -> predecessor's handler (tail for writes)
// Informs the predecessor that a successor is waiting.
message SuccessorRequestMessage {
    required uint64 p = 1;           // predecessor's shardtag
    required uint64 s = 2;           // successor's shardtag
    required int32  succ_groupidx = 3;   // successor's shard group index
    required int32  succ_replicaidx = 4; // replica to send CoordResponse to
    repeated uint64 vector_clock = 5;    // client's current VC for sync
}

// CoordResponse: predecessor's handler -> successor's handler
// Unblocks the successor write/read.
message PredecessorReplyMessage {
    required uint64 s = 1;            // successor's shardtag (for matching)
    repeated uint64 vector_clock = 2; // predecessor handler's VC at commit time
}

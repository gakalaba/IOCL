syntax = "proto2";

package replication;

message PerShardTag {
     required uint64 pid = 1;
     required uint64 seqno = 2;
}

message Request {
     required bytes op = 1;
     required uint64 clientid = 2;
     required uint64 clientreqid = 3;
     optional PerShardTag t = 4;
     repeated PerShardTag predlist = 5;
}

message UnloggedRequest {
     required bytes op = 1;
     required uint64 clientid = 2;
     required uint64 clientreqid = 3;
}

syntax = "proto2";

import "common-proto.proto";

package replication;

message UnloggedRequest {
     required bytes op = 1;
     required uint64 clientid = 2;
     required uint64 clientreqid = 3;
}

message KVOpMessage {
    enum Op {
          GET = 1;
          PUT = 2;
    }
    required Op op = 1;   // GET/PUT/etc, or better an enum
    required string key = 2;
    optional string value = 3;

    required uint32 idx = 4;
}

message PrepareMessage {
    required int32 coordinator = 1;
    repeated int32 participants = 2;
}

message CommitMessage {
}

message RequestIDMessage {
    required uint64 client_id = 1;
    required uint64 client_req_id = 2;
}

message LinearizeableOperation {
    enum Operation {
          KV_OP = 1;
          PREPARE = 2;
          COMMIT = 3;
          ABORT = 4;
    }
    required RequestIDMessage rid = 1;
    required uint64 transaction_id = 2;
    required Operation request_type = 4;
    optional KVOpMessage kv = 5;
    optional PrepareMessage prepare = 6;
    optional CommitMessage commit = 7;

    optional uint64 shardtag = 8;
    optional uint64 intkey = 9;
    repeated uint64 predlist = 10;
    repeated uint32 shardlist = 11;
}

message SuccessorRequestMessage {
    required uint64 p = 1;
    required uint64 s = 2;
    required uint32 predIdx = 3;
    required int32 shardIdx = 4;
}